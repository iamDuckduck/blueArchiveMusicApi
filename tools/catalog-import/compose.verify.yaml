# Separate project, ports and volumes: never points at the normal development catalog.
name: catalog-import-verify
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog_import_verify
      POSTGRES_USER: catalog_verify
      POSTGRES_PASSWORD: catalog-verify-local-only
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_verify -d catalog_import_verify"]
      interval: 2s
      timeout: 3s
      retries: 20
  storage:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: catalog_verify
      MINIO_ROOT_PASSWORD: catalog-verify-local-only
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - media-data:/data
volumes:
  postgres-data:
  media-data:
