<aside class="sidebar">
  <a class="brand" href="/catalog">Blue Archive Music</a>
  <nav aria-label="Workspace">
    {% for key, href, label in [('catalog', '/catalog', 'Albums'), ('credits', '/credits', 'Credit aliases')] %}
    <a class="nav-item{{ ' active' if navigation_section == key else '' }}" href="{{ href }}"{% if navigation_section == key %} aria-current="{{ 'location' if navigation_detail|default(false) else 'page' }}"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
</aside>
